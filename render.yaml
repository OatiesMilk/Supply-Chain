databases:
  - name: mg-portal-db
    databaseName: mg_portal
    user: mg_portal_user
    plan: free

services:
  - type: web
    name: mg-portal
    env: node
    plan: free
    # Build: install both frontend and backend deps, build Vite frontend,
    # then build the Express backend TypeScript, then generate Prisma client.
    buildCommand: >
      npm install --include=dev &&
      npm run prisma:generate --workspace=server &&
      npm run build
    # Start: run DB migrations (safe to run on every deploy),
    # seed if the DB is empty (idempotent), then start Express which
    # serves both the API and the built Vite frontend.
    startCommand: >
      cd server &&
      npx prisma migrate deploy &&
      npx tsx prisma/seed.ts &&
      cd .. &&
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mg-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      # Microsoft Azure AD SSO (set in Render dashboard)
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: APP_URL
        sync: false
      # SMTP fallback (if not using Graph API for email)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
