services:
  - type: web
    name: supply-chain-api
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: POD_UPLOAD_DIR
        value: /data/uploads/pod
    disk:
      name: pod-storage
      mountPath: /data
      sizeGB: 10
