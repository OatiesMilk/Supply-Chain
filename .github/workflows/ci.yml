name: CI Pipeline

# Trigger CI on push and pull requests to main, refactor, or feature branches
on:
  push:
    branches:
      - main
      - dev
      - staging
      - 'refactor/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev
      - staging

# Cancel redundant in-progress runs when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Global environment variables for CI steps
env:
  # Ephemeral CI-only database uses host auth method "trust" without a password
  DATABASE_URL: "postgresql://postgres@localhost:5432/mg_portal_ci_test"

jobs:
  quality-gate:
    name: Lint, Validate & Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js with automated npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean install of all root, client, and server dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Validate Prisma schema syntax and model integrity
      - name: Validate Prisma Schema
        run: npm run prisma:validate --workspace=server

      # Step 5: Generate Prisma Client (required for backend TypeScript types)
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=server

      # Step 6: Backend static type checking (tsc --noEmit)
      - name: Typecheck Backend (Server)
        run: npm run lint --workspace=server

      # Step 7: Compile Backend TypeScript to dist/
      - name: Build Backend (Server)
        run: npm run build --workspace=server

      # Step 8: Frontend static type checking (tsc --noEmit)
      - name: Typecheck Frontend (Client)
        run: npm run lint --workspace=client

      # Step 9: Build Frontend Vite production bundle
      - name: Build Frontend (Client)
        run: npm run build --workspace=client

      # Step 10: Run full server tests
      - name: Test Backend
        run: npm run test:server

      # Step 11: Run full client tests
      - name: Test Frontend
        run: npm run test:client

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: quality-gate

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mg_portal_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mg_portal_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=server

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: server

      # The seed guard still requires a loopback *_test database, an exact
      # LOCAL_SEED_DATABASE match, and explicit development opt-in. CI is
      # cleared only for this isolated service-container seed step.
      - name: Seed isolated E2E database
        run: npm run seed:uat --workspace=mg-portal-server
        env:
          CI: ""
          NODE_ENV: development
          LOCAL_DESTRUCTIVE_SEED: "true"
          LOCAL_SEED_DATABASE: mg_portal_ci_test

      - name: Build Backend and Frontend
        run: |
          npm run build --workspace=server
          npm run build --workspace=client

      - name: Install E2E Dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Generate ephemeral JWT secret
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Run E2E Tests
        run: |
          set -euo pipefail

          # Express serves the built client and API from one origin. The E2E
          # suite intentionally targets port 3000.
          npm run start --workspace=server &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Server did not become healthy within 60 seconds" >&2
              exit 1
            fi
            sleep 1
          done

          # Run isolated role suites
          npm run e2e:sc
          npm run e2e:logistics
          npm run e2e:driver
          npm run e2e:integration
        env:
          NODE_ENV: production
          PORT: "3000"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
